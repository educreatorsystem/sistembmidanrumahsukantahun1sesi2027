:root{font:16px system-ui,sans-serif;color:#123b47;background:#f0f7f8}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dbe9ec;padding:18px max(5vw,20px);display:flex;align-items:center;gap:14px}header img{width:56px;height:56px;object-fit:contain}header strong{flex:1}main{max-width:1160px;margin:auto;padding:32px 20px}h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.08;letter-spacing:-.04em}h2{font-size:1.65rem}p{line-height:1.7}button,.button{cursor:pointer;border:0;border-radius:12px;background:#087d7a;color:white;font:600 1rem system-ui;padding:14px 20px;display:inline-block;text-decoration:none}button.secondary{background:#e4eff1;color:#174a56}button.danger{background:#a53142}button:disabled{opacity:.55;cursor:wait}input,select,textarea{font:inherit;border:1px solid #b9cdd3;border-radius:10px;padding:12px;width:100%;background:white;color:#123b47}label{display:block;font-weight:600;margin:14px 0 6px}small{font-size:.875rem;color:#52707a}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;background:#dff3ee;padding:38px;border-radius:28px}.badge{display:inline-block;border-radius:30px;background:#fff1c5;padding:9px 15px;font-weight:700}.card{background:white;border:1px solid #dbe8ea;border-radius:20px;padding:26px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.shirt{background:#bde6df;border-radius:24px;text-align:center;padding:25px}.shirt img{width:100%;max-height:340px;object-fit:contain}.shirt svg{max-width:300px;width:100%}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px 10px;border-bottom:1px solid #e1ebed;vertical-align:top}th{background:#f0f7f8}.scroll{overflow:auto}.message{padding:15px;background:#fff0d0;border-radius:12px;margin:12px 0}.error{background:#ffe3e4;color:#7b2030}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stats b{font-size:2rem;display:block}.line{display:grid;grid-template-columns:1fr 100px auto;gap:10px;margin:10px 0}.bar{background:#0e9287;border-radius:6px;height:22px;min-width:2px}.hidden{display:none!important}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}footer{text-align:center;padding:24px;color:#597580}#busy{position:fixed;bottom:20px;right:20px;background:#123b47;color:white;padding:15px;border-radius:12px;z-index:9}dialog{border:0;border-radius:20px;max-width:650px;width:95%;max-height:90vh}dialog::backdrop{background:#123b4799}@media(max-width:720px){.hero,.grid{grid-template-columns:1fr}.hero{padding:24px}main{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.line{grid-template-columns:1fr 80px auto}.card{padding:18px}}@media print{body{background:white}header,footer,nav,.actions,button,#busy,#message,.noPrint{display:none!important}main{padding:0;max-width:none}.card{border:0;padding:0}.scroll{overflow:visible}table{font-size:11pt}tr{break-inside:avoid}@page{size:A4;margin:15mm}}

main{max-width:none;padding:0}h2{font-size:1.5rem;color:#374151}h3{color:#374151}button,.button{background:#3b82f6;border-radius:10px;transition:background .15s,transform .15s,box-shadow .15s}button:hover:not(:disabled),.button:hover{transform:translateY(-1px);box-shadow:0 5px 13px #3b82f630}button.secondary{background:#eef2f8;color:#526174}button.danger{background:#b83b50}button:focus-visible,a:focus-visible{outline:3px solid #e7b844;outline-offset:3px}

.grid{gap:22px}.card.soft{background:linear-gradient(115deg,#fff,#f1fcf6)}.guide ol{padding-left:26px;line-height:2.3;color:#657080}.guide h2{margin-top:0}.hint{background:#d1fae5;border-radius:9px;color:#138666;padding:14px 18px;font-weight:600}.message{background:#edf4ff;color:#315f9f}.error{background:#ffe3e4;color:#7b2030}.shirt{background:linear-gradient(140deg,#eff6ff,#f2fbf8);border:1px solid #e3edf2;border-radius:14px;padding:20px}.shirt svg{max-height:220px}.shirt img{max-height:280px}.badge{background:#eff6ff;color:#3376c7;font-size:.9rem}.bar{background:linear-gradient(90deg,#3b82f6,#8b70d6)}th{background:#f2f5fa;color:#536174}.stats b{color:#3b82f6;font-size:1.8rem;margin-top:8px}.stats .card{margin-bottom:0}nav button{font-size:.95rem}footer{font-size:.9rem;color:#8691a0;padding:28px 0 4px}input,select,textarea{color:#374151;border-color:#d4dce7}input:focus,select:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:#3b82f6}.orderStart{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.orderStart h2{margin-top:0}

</style></head><body><header><img id="logo" hidden alt="Lencana sekolah"><div class="brand"><h1>TEMPAHAN BAJU SUKAN<br>TAHUN 1 SESI 2027</h1><strong id="school">Nama Sekolah</strong><p>Sistem Pengurusan Tempahan Baju Sukan Murid</p></div></header><nav class="publicNav" aria-label="Menu utama"><button id="tabHome" class="active" onclick="home()">Tempahan Ibu Bapa</button><button id="tabLookup" onclick="lookupPage()">Semak Tempahan (Ibu Bapa)</button><button id="tabPanel" onclick="token?dashboard():loginPage()">Panel Pengurusan Sekolah</button><button onclick="token?dashboard():loginPage()">Log Masuk Admin</button></nav><main><div id="message" role="alert"></div><div id="view"></div></main><footer>Tempahan Baju Sukan Tahun 1 • Sesi 2027</footer><div id="busy" hidden aria-live="polite">Sedang memproses…</div><dialog id="review"><h2>Semak ringkasan tempahan</h2><div id="reviewContent"></div><div class="actions"><button id="confirmSend">Sahkan & Hantar</button><button class="secondary" onclick="document.querySelector('#review').close()">Kembali</button></div></dialog><script>
let cfg,opened=false,token='',adminOrders=[],current=null,editMode='',requestId='',pending=false;
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'RM '+Number(n||0).toFixed(2),date=s=>new Date(s).toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur'});
function message(s,error=false){$('#message').innerHTML=s?'<div class="message '+(error?'error':'')+'">'+E(s)+'</div>':'';}
async function call(action,p={}){if(pending)throw Error('Sila tunggu proses semasa.');pending=true;$('#busy').hidden=false;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(Error('Buka sistem melalui pautan Google Apps Script selepas pemasangan.'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action,{...p,token});});if(!r.ok)throw Error(r.error);return r.data;}finally{pending=false;$('#busy').hidden=true;document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function run(fn){message('');Promise.resolve().then(fn).catch(e=>message(e.message,true));}
function chartTable(){return '<div class="scroll"><table><thead><tr><th>Saiz</th><th>Lebar dada</th><th>Panjang baju</th><th>Unit</th></tr></thead><tbody>'+cfg.sizes.filter(s=>s.active).map(s=>`<tr><td>${E(s.label)}</td><td>${E(s.chest)}</td><td>${E(s.length)}</td><td>${E(s.unit)}</td></tr>`).join('')+'</tbody></table></div>';}
function activeTab(id){document.querySelectorAll('.publicNav button').forEach(b=>b.classList.toggle('active',b.id===id));}
function home(){current=null;message('');activeTab('tabHome');$('#view').innerHTML=`<section class="card guide"><h2>📋 Cara Membuat Tempahan</h2><ol><li>Isi nama murid dan nombor MyKid.</li><li>Pilih kelas atau “Belum ditetapkan”.</li><li>Rujuk carta ukuran pembekal dan pilih saiz baju.</li><li>Isi kuantiti. Gunakan “Tambah Saiz” untuk saiz tambahan.</li><li>Semak ringkasan, hantar tempahan dan simpan nombor rujukan.</li></ol><div class="hint">Simpan nombor rujukan untuk menyemak atau mengemas kini tempahan anda.</div></section><section class="card soft orderStart"><div><h2>Tempahan Baju Sukan Tahun 1</h2><p>Tempah baju anak untuk sesi 2027 dengan mudah dan teratur.</p><span class="badge">${opened?'Tempahan dibuka':cfg.ready?(new Date()<new Date(cfg.open+'+08:00')?'Tempahan belum dibuka':'Tempahan telah ditutup'):'Maklumat pembekal sedang disediakan'}</span></div><div class="actions"><button onclick="orderForm()" ${opened?'':'disabled'}>Buat Tempahan</button><button class="secondary" onclick="lookupPage()">Semak Tempahan</button></div></section><section class="grid"><div class="card"><h2>Contoh Baju & Harga</h2><div class="shirt">${cfg.image?`<img src="${E(cfg.image)}" alt="Contoh baju pembekal">`:'<svg viewBox="0 0 300 300" role="img" aria-label="Ilustrasi baju"><path fill="#5975c7" d="M95 45 40 75 10 135 65 160 82 128 82 260 218 260 218 128 235 160 290 135 260 75 205 45 180 55 120 55Z"/><path fill="#fff" d="M120 55Q150 110 180 55L165 50Q150 75 135 50Z"/><path stroke="#ffda54" stroke-width="15" d="M83 155H218"/></svg><p>Ilustrasi sahaja · Gambar pembekal akan dikemas kini</p>'}<h2>${cfg.ready?money(cfg.price)+' / helai':'Harga akan ditetapkan'}</h2></div><p style="white-space:pre-line">${E(cfg.instructions)}</p><p><b>Tarikh tutup tempahan</b><br>${date(cfg.close+'+08:00')}</p><small>Semua masa mengikut waktu Malaysia.</small></div><div class="card soft"><h2>Carta Ukuran Pembekal</h2><p>Rujuk ukuran yang diberikan sebelum memilih saiz.</p>${cfg.sizes.length?chartTable():'<p>Carta ukuran akan disediakan oleh sekolah.</p>'}</div></section>`;}
function field(label,name,value='',type='text',extra=''){return `<label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${E(value)}" ${extra}>`;}
function orderForm(order=null,mode=''){message('');if(!mode&&!opened)return;current=order;editMode=mode;requestId=crypto.randomUUID();$('#view').innerHTML=`<div class="grid"><section class="card"><h2>${order?'Kemas Kini':'Buat'} Tempahan</h2><form id="orderForm">${field('Nama penuh murid','name',order?.name,'text','required maxlength="200"')}${field('Nombor MyKid','mykid',order?.mykid,'text','required inputmode="numeric" pattern="[0-9]{12}" maxlength="12" '+(mode==='parent'?'readonly':''))}<label>Kelas</label><select name="className">${['Belum ditetapkan',...cfg.classes].map(c=>`<option ${order?.className===c?'selected':''}>${E(c)}</option>`).join('')}</select>${field('Nama ibu bapa / penjaga','guardian',order?.guardian,'text','required')}${field('Nombor telefon penjaga','phone',order?.phone,'tel','required')}<label>Saiz & kuantiti</label><div id="items"></div><button type="button" class="secondary" onclick="addItem()">Tambah Saiz</button><label>Catatan tambahan (pilihan)</label><textarea name="notes" maxlength="1000">${E(order?.notes||'')}</textarea>${mode==='admin'?'<label>Status</label><select name="status">'+['Menunggu','Disahkan','Dibatalkan'].map(s=>`<option ${order.status===s?'selected':''}>${s}</option>`).join('')+'</select>':''}<div class="message" id="total"></div><button type="submit">Semak Ringkasan</button><button type="button" class="secondary" style="margin-left:8px" onclick="editMode==='admin'?dashboard():home()">Kembali</button></form></section><aside class="card"><h2>Carta ukuran</h2>${chartTable()}<p>Lebar dada ialah ukuran baju ketika dibentangkan. Ikut panduan pembekal.</p><p>Harga sehelai: <b>${money(order?.unitPrice??cfg.price)}</b></p></aside></div>`;(order?.items||[{}]).forEach(i=>addItem(i));$('#orderForm').onsubmit=e=>{e.preventDefault();run(reviewOrder);};}
function addItem(item={}){const div=document.createElement('div');div.className='line';div.innerHTML=`<select aria-label="Saiz baju" required>${cfg.sizes.filter(s=>s.active||s.id===item.id).map(s=>`<option value="${E(s.id)}" ${s.id===item.id?'selected':''}>${E(s.label)}${s.active?'':' (tidak aktif)'}</option>`).join('')}</select><input aria-label="Kuantiti" type="number" min="1" max="999" step="1" required value="${item.qty||1}"><button type="button" class="secondary" aria-label="Buang saiz">×</button>`;div.querySelector('button').onclick=()=>{div.remove();totals();};div.oninput=totals;$('#items').append(div);totals();}
function getOrder(){const f=new FormData($('#orderForm'));return {...Object.fromEntries(f),items:[...document.querySelectorAll('#items .line')].map(l=>({id:l.querySelector('select').value,qty:Number(l.querySelector('input').value)}))};}
function totals(){const d=getOrder(),q=d.items.reduce((a,i)=>a+i.qty,0);$('#total').textContent=`${q} helai · ${money(q*(current?.unitPrice??cfg.price))}`;}
function summary(d){return `<p><b>${E(d.name)}</b><br>${E(d.className)}<br>${E(d.guardian)} · ${E(d.phone)}</p><table><tr><th>Saiz</th><th>Kuantiti</th></tr>${d.items.map(i=>`<tr><td>${E(i.label||cfg.sizes.find(s=>s.id===i.id)?.label)}</td><td>${i.qty} helai</td></tr>`).join('')}</table><p><b>${d.items.reduce((a,i)=>a+i.qty,0)} helai · ${money(d.total??d.items.reduce((a,i)=>a+i.qty,0)*(current?.unitPrice??cfg.price))}</b></p>`;}
function reviewOrder(){const d=getOrder();if(!d.items.length||new Set(d.items.map(i=>i.id)).size!==d.items.length)throw Error('Pilih saiz berbeza pada setiap baris.');$('#reviewContent').innerHTML=summary(d);$('#review').showModal();$('#confirmSend').onclick=()=>run(async()=>{if(d.status==='Dibatalkan'&&!confirm('Batalkan tempahan ini?'))return;const saved=await call(editMode==='admin'?'adminUpdate':editMode==='parent'?'parentUpdate':'create',{order:d,status:d.status,ref:current?.ref,phone:current?.phone,requestId});$('#review').close();if(editMode==='admin'){await loadAdmin();return;}receipt(saved);message('Tempahan berjaya disimpan. Sila simpan nombor rujukan.');});}
function lookupPage(){activeTab('tabLookup');$('#view').innerHTML=`<section class="card" style="max-width:600px;margin:auto"><h2>Semak Tempahan</h2><p>Masukkan nombor rujukan dan telefon yang digunakan semasa tempahan.</p><form id="lookup">${field('Nombor rujukan','ref','','text','required')}${field('Nombor telefon penjaga','phone','','tel','required')}<div class="actions"><button>Semak Tempahan</button></div></form></section>`;$('#lookup').onsubmit=e=>{e.preventDefault();run(async()=>receipt(await call('lookup',Object.fromEntries(new FormData(e.target)))));};}
function receipt(d){current=d;$('#view').innerHTML=`<article class="card"><p>${E(cfg.school)} · SESI 2027</p><h2>Resit Tempahan Baju Sukan</h2><h3>${E(d.ref)}</h3><p>Tarikh: ${date(d.created)}<br>Status: ${E(d.status)}</p>${summary(d)}<p>Catatan: ${E(d.notes||'—')}</p><small>Resit ini ialah pengesahan tempahan, bukan pengesahan bayaran.</small><div class="actions"><button onclick="window.print()">Cetak / Simpan PDF</button>${opened&&cfg.allowEdit&&d.status!=='Dibatalkan'?'<button class="secondary" onclick="orderForm(current,\'parent\')">Kemas Kini Tempahan</button>':''}<button class="secondary" onclick="home()">Selesai</button></div></article>`;}
function loginPage(){activeTab('tabPanel');message('');$('#view').innerHTML=`<section class="card" style="max-width:480px;margin:auto"><span class="badge">PANEL SEKOLAH</span><h2>Log Masuk Admin</h2><form id="login">${field('Username','username','','text','required autocomplete="username"')}${field('Kata laluan','password','','password','required autocomplete="current-password"')}<button type="button" class="secondary" style="margin-top:8px" onclick="$('#password').type=$('#password').type==='password'?'text':'password'">Papar / Sembunyikan</button><div class="actions"><button>Log Masuk</button></div></form></section>`;$('#login').onsubmit=e=>{e.preventDefault();run(async()=>{token=(await call('login',Object.fromEntries(new FormData(e.target)))).token;await loadAdmin();});};}
async function loadAdmin(){const d=await call('adminData');cfg=d.settings;adminOrders=d.orders;dashboard();}
function nav(active){activeTab('tabPanel');return `<nav>${['Dashboard','Senarai Tempahan','Analisis Saiz','Rumusan Pembekal','Tetapan'].map((s,i)=>`<button class="${active===i?'':'secondary'}" onclick="adminTab(${i})">${s}</button>`).join('')}<button class="secondary" onclick="run(async()=>{await call('logout');token='';home()})">Log Keluar</button></nav>`;}
function analysis(){const active=adminOrders.filter(o=>o.status!=='Dibatalkan'),total=active.reduce((a,o)=>a+o.quantity,0);return {active,total,students:new Set(active.map(o=>o.mykid)).size,rows:cfg.sizes.map(s=>{const orders=active.filter(o=>o.items.some(i=>i.id===s.id));const qty=orders.reduce((a,o)=>a+o.items.filter(i=>i.id===s.id).reduce((b,i)=>b+i.qty,0),0);return {...s,students:new Set(orders.map(o=>o.mykid)).size,qty,percent:total?qty/total*100:0};})};}
function adminTab(i){message('');if(!token){loginPage();return;}[dashboard,listPage,analysisPage,supplierPage,settingsPage][i]();}
function dashboard(){const a=analysis(),top=a.rows.filter(r=>r.qty===Math.max(...a.rows.map(x=>x.qty))&&r.qty>0).map(r=>r.label).join(', ')||'—';$('#view').innerHTML=nav(0)+'<h2>Gambaran Tempahan</h2><div class="stats">'+[['Murid unik',a.students],['Tempahan aktif',a.active.length],['Jumlah helai',a.total],['Nilai tempahan',money(a.active.reduce((n,o)=>n+o.total,0))],['Saiz paling popular',top],['Kemas kini terakhir',adminOrders.length?date(adminOrders.map(o=>o.updated).sort().at(-1)):'—']].map(([l,v])=>`<div class="card"><small>${l}</small><b>${E(v)}</b></div>`).join('')+'</div><button onclick="run(loadAdmin)">Muat Semula Data</button>';}
function listPage(){$('#view').innerHTML=nav(1)+`<h2>Senarai Tempahan</h2><div class="card noPrint"><div class="grid"><input id="search" placeholder="Cari nama atau rujukan"><select id="classFilter"><option value="">Semua kelas</option>${['Belum ditetapkan',...cfg.classes].map(c=>`<option>${E(c)}</option>`)}</select><select id="sizeFilter"><option value="">Semua saiz</option>${cfg.sizes.map(s=>`<option value="${E(s.id)}">${E(s.label)}</option>`)}</select><select id="statusFilter"><option value="">Semua status</option><option>Menunggu</option><option>Disahkan</option><option>Dibatalkan</option></select></div><div class="actions"><button onclick="exportOrders()">CSV Senarai</button><button class="secondary" onclick="run(loadAdmin)">Muat Semula</button></div></div><div class="card scroll" id="list"></div>`;['search','classFilter','sizeFilter','statusFilter'].forEach(id=>$('#'+id).oninput=renderList);renderList();}
function filtered(){return adminOrders.filter(o=>(o.name+' '+o.ref).toLowerCase().includes($('#search').value.toLowerCase())&&(!$('#classFilter').value||o.className===$('#classFilter').value)&&(!$('#sizeFilter').value||o.items.some(i=>i.id===$('#sizeFilter').value))&&(!$('#statusFilter').value||o.status===$('#statusFilter').value));}
function renderList(){$('#list').innerHTML='<table><tr><th>Murid / Rujukan</th><th>Kelas</th><th>Tempahan</th><th>Status</th><th>Tindakan</th></tr>'+filtered().map(o=>`<tr><td>${E(o.name)}<br><small>${E(o.ref)}</small></td><td>${E(o.className)}</td><td>${o.quantity} helai<br>${money(o.total)}</td><td>${E(o.status)}</td><td><button class="secondary" data-ref="${E(o.ref)}">Lihat / Sunting</button></td></tr>`).join('')+'</table>';$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>orderForm(adminOrders.find(o=>o.ref===b.dataset.ref),'admin'));}
function analysisPage(){const a=analysis();$('#view').innerHTML=nav(2)+`<article class="card"><h2>Analisis Saiz Baju</h2><p>${E(cfg.school)} · Sesi 2027 · ${date(new Date())}</p><p>${a.students} murid unik · ${a.total} helai</p>${!a.total?'<p>Belum ada tempahan aktif.</p>':''}<div class="scroll"><table><tr><th>Saiz Baju</th><th>Bilangan Murid</th><th>Jumlah Helai</th><th>Peratus Jumlah Helai</th></tr>${a.rows.map(r=>`<tr><td>${E(r.label)}</td><td>${r.students}</td><td>${r.qty}</td><td>${r.percent.toFixed(2)}%</td></tr>`).join('')}</table></div><h3>Jumlah helai mengikut saiz</h3>${a.rows.map(r=>`<div style="margin:14px 0"><b>${E(r.label)} · ${r.qty} helai</b><div class="bar" style="width:${a.total?r.qty/Math.max(...a.rows.map(x=>x.qty))*100:0}%"></div></div>`).join('')}<small>Seorang murid boleh dikira pada lebih daripada satu saiz. Tempahan dibatalkan dikecualikan.</small><div class="actions"><button onclick="window.print()">Cetak A4 / Eksport PDF</button><button class="secondary" onclick="exportSizes()">CSV Rumusan</button></div></article>`;}
function supplierPage(){const a=analysis();$('#view').innerHTML=nav(3)+`<article class="card"><h2>Rumusan Tempahan Untuk Pembekal</h2><p>${E(cfg.school)}<br>Sesi 2027 · Tarikh laporan: ${date(new Date())}</p><table><tr><th>Saiz Baju</th><th>Jumlah Helai Diperlukan</th></tr>${a.rows.map(r=>`<tr><td>${E(r.label)}</td><td>${r.qty}</td></tr>`).join('')}<tr><th>JUMLAH KESELURUHAN</th><th>${a.total}</th></tr></table><div class="actions"><button onclick="window.print()">Cetak A4 / Simpan PDF</button><button class="secondary" onclick="exportSizes()">Muat Turun CSV</button></div></article>`;}
function csv(name,rows){const text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportOrders(){csv('Senarai_Tempahan_2027.csv',[['Rujukan','Nama','MyKid (teks)','Kelas','Penjaga','Telefon','Saiz','Kuantiti','Jumlah Helai','Jumlah RM','Status','Tarikh'],...filtered().flatMap(o=>o.items.map(i=>[o.ref,o.name,"'"+o.mykid,o.className,o.guardian,"'"+o.phone,i.label,i.qty,o.quantity,o.total,o.status,o.created]))]);}
function exportSizes(){const a=analysis();csv('Rumusan_Saiz_2027.csv',[['Sekolah',cfg.school],['Sesi','2027'],['Tarikh',date(new Date())],['Saiz Baju','Jumlah Helai Diperlukan'],...a.rows.map(r=>[r.label,r.qty]),['JUMLAH',a.total]]);}
function settingsPage(){$('#view').innerHTML=nav(4)+`<section class="card"><h2>Tetapan Sekolah & Pembekal</h2><form id="settings">${field('Nama sekolah','school',cfg.school,'text','required')}${field('URL lencana (HTTPS)','logo',cfg.logo,'url')}${field('URL gambar contoh baju (HTTPS)','image',cfg.image,'url')}${field('Harga sehelai (RM)','price',cfg.price,'number','min="0" step="0.01" required')}<div class="grid"><div>${field('Tarikh buka (waktu Malaysia)','open',cfg.open,'datetime-local','required')}</div><div>${field('Tarikh tutup (waktu Malaysia)','close',cfg.close,'datetime-local','required')}</div></div><label>Senarai kelas (satu kelas setiap baris)</label><textarea name="classes">${E(cfg.classes.join('\n'))}</textarea><label>Arahan ibu bapa</label><textarea name="instructions">${E(cfg.instructions)}</textarea><label><input name="allowEdit" type="checkbox" style="width:auto" ${cfg.allowEdit?'checked':''}> Benarkan pembetulan ibu bapa sebelum tarikh tutup</label><label><input name="ready" type="checkbox" style="width:auto" ${cfg.ready?'checked':''}> Maklumat pembekal telah disahkan; aktifkan tempahan mengikut tarikh</label><h3>Saiz pembekal</h3><p>Susunan baris menentukan urutan saiz dalam analisis. Nyahaktifkan saiz lama; jangan padam saiz yang sudah digunakan.</p><div id="sizes"></div><button type="button" class="secondary" onclick="sizeRow()">Tambah Saiz</button><div class="actions"><button>Simpan Tetapan</button></div></form></section><section class="card"><h2>Tukar Kata Laluan</h2><form id="changePassword">${field('Kata laluan baharu (minimum 10 aksara)','newPassword','','password','minlength="10" required autocomplete="new-password"')}<div class="actions"><button>Tukar Kata Laluan</button></div></form></section>`;cfg.sizes.forEach(sizeRow);$('#settings').onsubmit=e=>{e.preventDefault();run(async()=>{const f=new FormData(e.target),n={...cfg,...Object.fromEntries(f),price:Number(f.get('price')),classes:[...new Set(f.get('classes').split('\n').map(s=>s.trim()).filter(Boolean))],ready:f.has('ready'),allowEdit:f.has('allowEdit'),sizes:[...document.querySelectorAll('.sizeRow')].map(r=>({id:r.dataset.id,label:r.querySelector('[name=label]').value,chest:Number(r.querySelector('[name=chest]').value),length:Number(r.querySelector('[name=length]').value),unit:r.querySelector('[name=unit]').value,active:r.querySelector('[name=active]').checked}))};cfg=await call('settings',{settings:n});message('Tetapan berjaya disimpan.');});};$('#changePassword').onsubmit=e=>{e.preventDefault();run(async()=>{await call('password',{password:$('#newPassword').value});token='';loginPage();message('Kata laluan ditukar. Sila log masuk semula.');});};}
function sizeRow(s={}){const d=document.createElement('div');d.className='card sizeRow';d.dataset.id=s.id||crypto.randomUUID();d.innerHTML=`<div class="grid"><div><label>Nama saiz</label><input name="label" required value="${E(s.label||'')}"></div><div><label>Unit</label><select name="unit"><option ${s.unit==='cm'?'selected':''}>cm</option><option ${s.unit==='inci'?'selected':''}>inci</option></select></div><div><label>Lebar dada</label><input name="chest" type="number" min="0.1" step="0.1" required value="${s.chest||''}"></div><div><label>Panjang baju</label><input name="length" type="number" min="0.1" step="0.1" required value="${s.length||''}"></div></div><label><input name="active" type="checkbox" style="width:auto" ${s.active!==false?'checked':''}> Aktif</label><div class="actions"><button type="button" class="secondary" data-move="-1">Naik</button><button type="button" class="secondary" data-move="1">Turun</button></div>`;d.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{if(b.dataset.move==='-1'&&d.previousElementSibling)d.before(d.previousElementSibling);else if(b.dataset.move==='1'&&d.nextElementSibling)d.after(d.nextElementSibling);});$('#sizes').append(d);}
let lastActivity=Date.now();['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>lastActivity=Date.now()));setInterval(()=>{if(token&&Date.now()-lastActivity>1800000){const old=token;run(async()=>{try{await call('logout',{token:old});}finally{token='';adminOrders=[];loginPage();message('Sesi tamat selepas 30 minit tidak aktif.');}});}},30000);
run(async()=>{const d=await call('public');cfg=d.settings;opened=d.isOpen;$('#school').textContent=cfg.school;if(cfg.logo){$('#logo').src=cfg.logo;$('#logo').hidden=false;}home();});
</script></body></html>
